name: Verify and publish explorer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: explorer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolkit:
    name: Toolkit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up exact Python on Linux
        if: runner.os != 'Windows'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Install pinned Windows Python bootstrap
        if: runner.os == 'Windows'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.7'
          checksum: '0cdc5b38fe5a8168ed6a25814f5ba43c21d313dd3187314fccb37b7cec46e021'
          python-version: '3.12.14'
          enable-cache: false
      - name: Create exact Windows CPython environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv python install --managed-python 3.12.14
          if ($LASTEXITCODE -ne 0) { throw 'Exact CPython installation failed' }
          $runtime = (uv python find --managed-python 3.12.14).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Exact managed Python was not found' }
          & $runtime -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Python environment creation failed' }
          $venv = Join-Path $env:GITHUB_WORKSPACE '.venv'
          $scripts = Join-Path $venv 'Scripts'
          & (Join-Path $scripts 'python.exe') -c "import platform,struct,sys; assert sys.version_info[:3] == (3,12,14); assert platform.python_implementation() == 'CPython'; assert struct.calcsize('P') == 8; print(sys.version)"
          if ($LASTEXITCODE -ne 0) { throw 'Python runtime verification failed' }
          $scripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VIRTUAL_ENV=$venv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test portable pipeline against controlled fixtures
        run: python -m unittest discover -s code -p "test_case_pipeline*.py" -v
      - name: Verify public onboarding and local runtime configuration
        run: python -m unittest discover -s tools -p test_toolkit_public.py -v
      - name: Run the documented fictional example
        run: python tools/run_demo.py --output runs/ci-demo
      - name: Confirm tracked sources stay unchanged
        run: git diff --exit-code
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      authorized: ${{ steps.publication.outputs.authorized }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check publication boundaries
        run: python -m unittest discover -s tools -p test_site.py -v
      - name: Check browser projection and safety logic
        run: node --test web/tests/*.test.cjs
      - name: Build the reviewed static snapshot
        run: python tools/build_site.py --output site
      - name: Verify every deployed byte and exact projections
        run: |
          python tools/verify_site.py site
          node web/tests/check_bundle.cjs site/bundle.json
          git diff --exit-code
      - name: Read author publication authorization
        id: publication
        run: |
          python -c "import json,os; p=json.load(open('publication.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('authorized='+str(p['authorized']).lower()+'\n')"
      - name: Require authorization for a public deployment
        if: steps.publication.outputs.authorized == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.repository.private == false
        run: python tools/verify_site.py site --require-public-approval
      - name: Upload only the verified website
        if: steps.publication.outputs.authorized == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.repository.private == false
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: [build, toolkit]
    if: needs.build.outputs.authorized == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
